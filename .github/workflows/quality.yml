name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen
  QT_QUICK_CONTROLS_STYLE: Basic
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  checks:
    name: Lint, documentation and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Python lint
        run: python -m ruff check .
      - name: Documentation links and image credits
        run: python scripts/check_docs.py
      - name: Workflow lint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Dependency audit
        run: |
          mkdir -p artifacts
          python -m pip_audit --local --progress-spinner off --format json --output artifacts/pip-audit.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dependency-audit
          path: artifacts/pip-audit.json
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: Tests and wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    defaults:
      run:
        shell: bash
    env:
      TAGGER_TEST_ARTIFACTS: artifacts/failures
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Linux Qt runtime and fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libopengl0 libxkbcommon0 fontconfig fonts-dejavu-core
      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Offline unit, UI and local transport tests
        run: python -m pytest -q --cov --cov-report=term-missing --cov-report=xml --cov-report=html:artifacts/coverage --junitxml=artifacts/junit.xml --basetemp=artifacts/test-tmp
      - name: Build wheel and source archive
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Fresh wheel installation and offline startup
        run: python scripts/check_package.py dist
      - name: Upload test reports and diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            artifacts/junit.xml
            artifacts/coverage.xml
            artifacts/coverage/
            artifacts/failures/
            artifacts/test-tmp/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload built distributions
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: distributions-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*
          retention-days: 7

  result:
    name: CI
    if: always()
    needs: [checks, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality job to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$TESTS_RESULT" = success