[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tag-exif-turbo"
version = "0.0.1"
description = "Native Qt Quick image-tagging reviewer for Exif Turbo MCP and Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.12.0",
    "mcp==2.3.0",
    "httpx==0.28.1",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<1",
    "build>=1.3,<2",
    "twine>=7,<8",
    "pip-audit>=2.9,<3",
    "markdown-it-py>=3,<5",
]

[project.scripts]
tag-exif-turbo = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"qml" = "backend/resources/qml"
"assets" = "backend/resources/assets"

[tool.hatch.build.targets.sdist]
include = [
    "backend/",
    "qml/",
    "assets/",
    "docs/",
    "tests/",
    "main.py",
    "pyproject.toml",
    "README.md",
    ".env.example",
    "scripts/",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["artifacts", "dist", "build"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["backend", "main"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "artifacts/coverage.xml"